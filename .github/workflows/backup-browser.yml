name: Backup browser check
on:
  pull_request:
permissions:
  contents: read
jobs:
  backup-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/backup-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-browser-screenshots
          path: browser-artifacts/
          retention-days: 7
